<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Prioritize authentic Myanmar Unicode fonts with full HarfBuzz mym2 GSUB shaping in libass -->
  <match target="pattern">
    <test name="lang">
      <string>my</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Myanmar</string>
      <string>Padauk</string>
    </edit>
  </match>

  <!-- Map Pyidaungsu requests in libass to Noto Sans Myanmar for accurate pre-base vowel/medial reordering -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>Pyidaungsu</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Noto Sans Myanmar</string>
    </edit>
  </match>

  <!-- Fallback aliases for generic font families in FFmpeg / libass -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans Myanmar</family>
      <family>Padauk</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Sans Myanmar</family>
      <family>Padauk</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Myanmar</family>
      <family>Padauk</family>
    </prefer>
  </alias>
</fontconfig>
